<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto" role="img" aria-label="Monero Seed Key Derivation Comparison">
  <rect width="1200" height="500" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="36" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">Key Derivation Comparison Across Monero Seed Formats</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Why 13-word MyMonero and 12-word Exodus phrases cannot simply be pasted into standard 25-word wallets without format-specific derivation</text>

  <!-- Column 1: 25-Word Legacy -->
  <g transform="translate(32, 92)">
    <rect width="268" height="376" rx="10" fill="#161b22" stroke="#ff6600" stroke-width="1.5"/>
    <rect width="268" height="38" rx="10" fill="#24160e"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ff6600">1. 25-Word Legacy (Electrum)</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#c9d1d9">
      <rect x="16" y="54" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="74" fill="#f0f6fc" font-weight="700">24 Data + 1 CRC32 Word</text>
      <text x="26" y="94" fill="#8b949e">1,626 words (3-char prefix)</text>

      <text x="128" y="124" fill="#ff6600" text-anchor="middle">↓ Base-1626 Decode</text>

      <rect x="16" y="134" width="236" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="154" fill="#f0f6fc" font-weight="700">32-Byte Seed (256-bit)</text>
      <text x="26" y="172" fill="#8b949e">8 × uint32 little-endian</text>

      <text x="128" y="202" fill="#ff6600" text-anchor="middle">↓ Direct / sc_reduce32</text>

      <rect x="16" y="212" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="232" fill="#3fb950" font-weight="700">Private Spend Key (b)</text>
      <text x="26" y="250" fill="#8b949e">b = seed_32_bytes</text>

      <text x="128" y="282" fill="#ff6600" text-anchor="middle">↓ Keccak-256(b)</text>

      <rect x="16" y="292" width="236" height="64" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="312" fill="#58a6ff" font-weight="700">Private View Key (a)</text>
      <text x="26" y="330" fill="#c9d1d9">a = sc_reduce32(keccak(b))</text>
      <text x="26" y="346" fill="#8b949e">No embedded birthday</text>
    </g>
  </g>

  <!-- Column 2: 16-Word Polyseed -->
  <g transform="translate(321, 92)">
    <rect width="268" height="376" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="268" height="38" rx="10" fill="#102418"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3fb950">2. 16-Word Polyseed</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#c9d1d9">
      <rect x="16" y="54" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="74" fill="#f0f6fc" font-weight="700">16 Words (176 bits total)</text>
      <text x="26" y="94" fill="#8b949e">2,048 words • GF(2048) poly</text>

      <text x="128" y="124" fill="#3fb950" text-anchor="middle">↓ Unpack + PBKDF2-SHA256</text>

      <rect x="16" y="134" width="236" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="154" fill="#f0f6fc" font-weight="700">150-Bit Secret + Date</text>
      <text x="26" y="172" fill="#8b949e">10,000 iter • coin 0x80000080</text>

      <text x="128" y="202" fill="#3fb950" text-anchor="middle">↓ sc_reduce32(derived_32)</text>

      <rect x="16" y="212" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="232" fill="#3fb950" font-weight="700">Private Spend Key (b)</text>
      <text x="26" y="250" fill="#8b949e">b = sc_reduce32(kdf_out)</text>

      <text x="128" y="282" fill="#3fb950" text-anchor="middle">↓ Standard Keccak-256(b)</text>

      <rect x="16" y="292" width="236" height="64" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="312" fill="#58a6ff" font-weight="700">Private View Key (a)</text>
      <text x="26" y="330" fill="#c9d1d9">a = sc_reduce32(keccak(b))</text>
      <text x="26" y="346" fill="#3fb950">✓ Embedded wallet birthday</text>
    </g>
  </g>

  <!-- Column 3: 13-Word MyMonero -->
  <g transform="translate(610, 92)">
    <rect width="268" height="376" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="268" height="38" rx="10" fill="#101f33"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">3. 13-Word MyMonero</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#c9d1d9">
      <rect x="16" y="54" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="74" fill="#f0f6fc" font-weight="700">12 Data + 1 CRC32 Word</text>
      <text x="26" y="94" fill="#8b949e">1,626 words (16-byte seed)</text>

      <text x="128" y="124" fill="#58a6ff" text-anchor="middle">↓ h1 = Keccak-256(seed_16)</text>

      <rect x="16" y="134" width="236" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="154" fill="#f0f6fc" font-weight="700">Unreduced Hash (h1)</text>
      <text x="26" y="172" fill="#8b949e">32-byte raw Keccak digest</text>

      <text x="128" y="202" fill="#58a6ff" text-anchor="middle">↓ Reduce h1 mod l</text>

      <rect x="16" y="212" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="232" fill="#3fb950" font-weight="700">Private Spend Key (b)</text>
      <text x="26" y="250" fill="#8b949e">b = sc_reduce32(h1)</text>

      <text x="128" y="282" fill="#f85149" text-anchor="middle">⚠ Hashes UNREDUCED h1!</text>

      <rect x="16" y="292" width="236" height="64" rx="6" fill="#1c1214" stroke="#f85149"/>
      <text x="26" y="312" fill="#f85149" font-weight="700">Private View Key (a)</text>
      <text x="26" y="330" fill="#f0f6fc">a = sc_reduce32(keccak(h1))</text>
      <text x="26" y="346" fill="#ff7b72">Differs from keccak(b) if h1 ≥ l</text>
    </g>
  </g>

  <!-- Column 4: 12-Word Exodus / BIP-39 -->
  <g transform="translate(899, 92)">
    <rect width="268" height="376" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect width="268" height="38" rx="10" fill="#261d0f"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#d29922">4. 12-Word Exodus (BIP-39)</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#c9d1d9">
      <rect x="16" y="54" width="236" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="74" fill="#f0f6fc" font-weight="700">12 BIP-39 Words</text>
      <text x="26" y="94" fill="#8b949e">PBKDF2-SHA512 → 64B seed</text>

      <text x="128" y="124" fill="#d29922" text-anchor="middle">↓ BIP-32 secp256k1</text>

      <rect x="16" y="134" width="236" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="154" fill="#f0f6fc" font-weight="700">m/44&apos;/128&apos;/0&apos;/0/0</text>
      <text x="26" y="172" fill="#8b949e">32-byte child private key (k)</text>

      <text x="128" y="202" fill="#d29922" text-anchor="middle">⚠ Direct reduce (no Keccak)</text>

      <rect x="16" y="212" width="236" height="52" rx="6" fill="#1f1a10" stroke="#d29922"/>
      <text x="26" y="232" fill="#3fb950" font-weight="700">Private Spend Key (b)</text>
      <text x="26" y="250" fill="#f0f6fc">b = sc_reduce32(k)</text>

      <text x="128" y="282" fill="#d29922" text-anchor="middle">↓ Standard Keccak-256(b)</text>

      <rect x="16" y="292" width="236" height="64" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="26" y="312" fill="#58a6ff" font-weight="700">Private View Key (a)</text>
      <text x="26" y="330" fill="#c9d1d9">a = sc_reduce32(keccak(b))</text>
      <text x="26" y="346" fill="#d29922">Convertible to 25-word seed</text>
    </g>
  </g>
</svg>
