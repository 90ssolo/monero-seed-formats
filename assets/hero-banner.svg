<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" role="img" aria-label="Monero Seed Formats Reference">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="xmr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ff8533"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#xmr)"/>

  <!-- Official Monero Symbol -->
  <g transform="translate(56, 56) scale(0.28)">
    <circle cx="128" cy="128" r="128" fill="#ffffff"/>
    <path fill="#FF6600" d="M127.998,0.001 C57.309,0.001 0,57.306 0,127.999 C0,142.129 2.29,155.724 6.517,168.436 L44.797,168.436 L44.797,61.033 L127.999,144.234 L211.2,61.033 L211.2,168.436 L249.48,168.436 C253.708,155.724 255.997,142.129 255.997,127.999 C255.996,57.306 198.688,0.001 127.998,0.001 Z"/>
    <path fill="#4C4C4C" d="M108.876,163.362 L72.036,126.522 L72.036,195.21 L38.209,195.21 L18.361,195.21 C40.822,231.693 81.539,256.0 127.998,256.0 C174.458,256.0 215.174,231.693 237.637,195.21 L217.789,195.21 L183.961,195.21 L183.961,126.522 L147.121,163.362 L127.998,182.485 L108.876,163.362 L108.876,163.362 Z"/>
  </g>

  <text x="144" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ff6600" letter-spacing="1.5">TECHNICAL SPECIFICATION &amp; TEST VECTORS</text>
  <text x="144" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc">Monero Seed Formats</text>

  <text x="56" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Encoding rules, key derivation math, checksum algorithms, and wallet compatibility across</text>
  <text x="56" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">25-word Legacy, 16-word Polyseed, 13-word MyMonero, and 12/24-word BIP-39 recovery phrases.</text>

  <!-- Format Badges -->
  <g transform="translate(56, 232)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#161b22" stroke="#ff6600" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#ff6600"/>
    <text x="34" y="23" fill="#f0f6fc">25-Word Legacy</text>

    <rect x="174" y="0" width="168" height="36" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="194" cy="18" r="5" fill="#3fb950"/>
    <text x="208" y="23" fill="#f0f6fc">16-Word Polyseed</text>

    <rect x="356" y="0" width="168" height="36" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="376" cy="18" r="5" fill="#58a6ff"/>
    <text x="390" y="23" fill="#f0f6fc">13-Word MyMonero</text>

    <rect x="538" y="0" width="180" height="36" rx="18" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="558" cy="18" r="5" fill="#d29922"/>
    <text x="572" y="23" fill="#f0f6fc">12-Word Exodus/BIP39</text>
  </g>

  <!-- Right Side Summary Card -->
  <g transform="translate(795, 42)">
    <rect x="0" y="0" width="355" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#ff6600">FORMATFINGERPRINT // QUICK LOOKUP</text>
    <line x1="22" y1="46" x2="333" y2="46" stroke="#30363d" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
      <text x="22" y="74" fill="#8b949e">25 words</text>
      <text x="108" y="74" fill="#c9d1d9">1626 list • 256-bit • CRC32</text>

      <text x="22" y="106" fill="#8b949e">16 words</text>
      <text x="108" y="106" fill="#c9d1d9">2048 list • 150-bit + Birthday</text>

      <text x="22" y="138" fill="#8b949e">13 words</text>
      <text x="108" y="138" fill="#c9d1d9">1626 list • 128-bit • Dual Keccak</text>

      <text x="22" y="170" fill="#8b949e">12 words</text>
      <text x="108" y="170" fill="#c9d1d9">2048 list • m/44&apos;/128&apos;/0&apos;/0/0</text>
    </g>

    <rect x="22" y="192" width="311" height="28" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
    <text x="34" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#3fb950">✓ Zero-dependency test vectors included</text>
  </g>
